name: Nyaya Setu CI/CD Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test-ai-engine:
    name: Python AI Engine Test Suite (Pytest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install AI Engine Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ai-engine/requirements.txt
          pip install pytest pytest-asyncio

      - name: Run Pytest Test Suite
        run: |
          pytest ai-engine/tests -v

  test-backend:
    name: Node.js Backend & E2E Integration Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm ci
          cd backend && npm ci && cd ..
          cd frontend && npm ci && cd ..

      - name: Run Backend Unit & Integration Tests
        run: |
          npm --prefix backend test

      - name: Run Full End-to-End Verification
        run: |
          node scripts/verify_all.js

  build-frontend:
    name: React Frontend Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: |
          cd frontend && npm ci

      - name: Build Frontend with Vite
        run: |
          npm --prefix frontend run build

  docker-build-check:
    name: Docker Multi-Container Build Validation
    runs-on: ubuntu-latest
    needs: [test-ai-engine, test-backend, build-frontend]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Build Docker Compose Images
        run: |
          docker compose -f docker/docker-compose.yml config
