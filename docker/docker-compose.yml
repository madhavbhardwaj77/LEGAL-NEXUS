version: '3.8'

services:
  # MongoDB Database with Persistent Volume & Healthcheck
  mongodb:
    image: mongo:7.0
    container_name: nyaya_setu_mongo
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: nyaya-setu
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nyaya_net

  # Redis Cache & Background Task Queue
  redis:
    image: redis:7.2-alpine
    container_name: nyaya_setu_redis
    restart: always
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nyaya_net

  # Node.js + Express Core Application Gateway
  backend:
    build:
      context: ../backend
      dockerfile: ../docker/backend.Dockerfile
    container_name: nyaya_setu_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGODB_URI: mongodb://mongodb:27017/nyaya-setu
      REDIS_URL: redis://redis:6379
      AI_ENGINE_URL: http://ai-engine:8000
      JWT_SECRET: super_secret_jwt_key_nyaya_setu_prod_2026
      JWT_EXPIRES_IN: 7d
      JWT_REFRESH_SECRET: super_secret_refresh_jwt_key_nyaya_setu_prod_2026
      CLIENT_URL: http://localhost:5173
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-engine:
        condition: service_started
    networks:
      - nyaya_net

  # Python FastAPI Case Intelligence & RAG AI Engine
  ai-engine:
    build:
      context: ../ai-engine
      dockerfile: ../docker/ai-engine.Dockerfile
    container_name: nyaya_setu_ai_engine
    restart: always
    ports:
      - "8000:8000"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ENVIRONMENT: production
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - nyaya_net

  # React + Tailwind Production Nginx Frontend
  frontend:
    build:
      context: ../frontend
      dockerfile: ../docker/frontend.Dockerfile
    container_name: nyaya_setu_frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - nyaya_net

volumes:
  mongo_data:
    driver: local
  redis_data:
    driver: local

networks:
  nyaya_net:
    driver: bridge
